name: Bump 1.10.7

# One-shot: UNote becomes one of the apps the hub asks the phone for, the version moves to 1.10.7,
# and the papers that counted four cards say five. It edits the files instead of carrying them, so
# the HTML the hub draws is never retyped by hand. Delete me once the release is out.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UNote is a declared default app, and the version is 1.10.7
        run: |
          python3 - <<'PY'
          import io, sys

          def read(p): return io.open(p, encoding='utf-8').read()
          def write(p, s): io.open(p, 'w', encoding='utf-8', newline='').write(s)

          def swap(s, old, new, what):
              if old not in s: sys.exit('missing: ' + what)
              return s.replace(old, new, 1)

          MAN = 'app/src/main/AndroidManifest.xml'
          PAGE = 'app/src/main/assets/index.html'
          GRADLE = 'app/build.gradle.kts'
          NOTES = 'PATCH_NOTES.md'
          README = 'README.md'
          STORE = 'PLAY_STORE.md'

          # 1. the phone is asked for UNote by name, like the other four
          m = read(MAN)
          if 'android:name="app.unote"' not in m:
              m = swap(m, '        <package android:name="app.ujournal" />\n',
                       '        <package android:name="app.ujournal" />\n'
                       '        <package android:name="app.unote" />\n', 'the queries list')
              write(MAN, m)

          # 2. the screen and the APK carry the same version
          p = read(PAGE)
          if 'HUB_PAGE = "1.10.7"' not in p:
              p = swap(p, 'var HUB_PAGE = "1.10.6";', 'var HUB_PAGE = "1.10.7";', 'HUB_PAGE')
              write(PAGE, p)

          g = read(GRADLE)
          if 'versionName = "1.10.7"' not in g:
              g = swap(g, 'versionName = "1.10.6"', 'versionName = "1.10.7"', 'versionName')
              write(GRADLE, g)

          # 3. what the update says
          n = read(NOTES)
          if '## 1.10.7' not in n:
              head = (
                  '## 1.10.7 - 8 November 2026\n\n'
                  'UNote is one of the hub\'s own apps, asked for the same way as the other four.\n\n'
                  '- **The phone is asked for it by name.** From Android 11 an app cannot see another app unless\n'
                  '  it says, in its manifest, which apps it wants to see. That list named four of the five apps\n'
                  '  the hub ships cards for; UNote was the one missing, so its card could sit on a phone that\n'
                  '  had UNote installed and still say there was nothing to open. `app.unote` is in the list\n'
                  '  now, beside `app.ujournal` and the rest.\n'
                  '- **The paper matches the app.** The card arrived in 1.10.6, but the README and the Play\n'
                  '  description still counted four cards and named four apps. Both name UNote now.\n\n'
              )
              write(NOTES, head + n)

          # 4. the README: the table of cards, the table of packages, and the prose
          r = read(README)
          if '**UNote**' not in r:
              r = swap(r, '| **UJournal** | the UJournal APK |\n',
                       '| **UJournal** | the UJournal APK |\n| **UNote** | the UNote APK |\n', 'the card table')
          if '| UNote |' not in r:
              r = swap(r,
                       '| UJournal | `app.ujournal` | looks for an app named "UJournal" or "Journal" |\n',
                       '| UJournal | `app.ujournal` | looks for an app named "UJournal" or "Journal" |\n'
                       '| UNote | `app.unote` | looks for an app named "UNote" |\n', 'the package table')
          r = swap(r, 'UJournal installs from the Journal repository as `app.ujournal`.',
                   'UJournal installs from the Journal repository as `app.ujournal`, and UNote from its own '
                   'repository as `app.unote`.', 'the prose about UJournal')
          r = swap(r, 'a phone that had all four apps on it', 'a phone that had all five apps on it', 'the four apps')
          r = swap(r, 'plus the package names outright, both SideCut ids\nincluded.',
                   'plus the package names outright, both SideCut ids and\n`app.unote` included.', 'the queries prose')
          write(README, r)

          # 5. the Play listing
          s = read(STORE)
          s = swap(s, 'FOUR CARDS AND TWO SLOTS', 'FIVE CARDS AND TWO SLOTS', 'the card count heading')
          s = swap(s, 'The hub ships with cards for the apps it was built alongside — FamTM, SideCut,\nMeasureT and UJournal — and two empty slots for anything else.',
                   'The hub ships with cards for the apps it was built alongside — FamTM, SideCut,\nMeasureT, UJournal and UNote — and two empty slots for anything else.', 'the card list')
          write(STORE, s)

          for path, needle in ((MAN, 'app.unote'), (PAGE, 'HUB_PAGE = "1.10.7"'),
                               (GRADLE, 'versionName = "1.10.7"'), (NOTES, '## 1.10.7'),
                               (README, 'UNote'), (STORE, 'FIVE CARDS AND TWO SLOTS')):
              if needle not in read(path):
                  sys.exit('%s did not take' % path)
          print('1.10.7 written')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.10.7: UNote is one of the apps the hub asks the phone for" || echo "already applied"
          git push
