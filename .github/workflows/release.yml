name: Release APK + AAB

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.6.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Signed APK, AAB and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set for this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myhub.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/myhub.p12" >> "$GITHUB_ENV"

      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          if [ -z "$V" ]; then echo "no version resolved"; exit 1; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "releasing $V"

      # A release publishes both formats: the APK for a phone, the AAB for Play Console.
      - name: Build the signed release APK and AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: myhub
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Name the files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          STATUS=0
          if [ ! -f "$APK" ]; then
            echo "::error::no signed APK was produced - check the keystore secrets"
            STATUS=1
          fi
          if [ ! -f "$AAB" ]; then
            echo "::error::no AAB was produced by bundleRelease"
            STATUS=1
          fi
          [ "$STATUS" -eq 0 ] || exit 1
          cp "$APK" "MyHub-${{ steps.v.outputs.name }}.apk"
          cp "$AAB" "MyHub-${{ steps.v.outputs.name }}.aab"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: My Hub ${{ steps.v.outputs.name }}
          files: MyHub-*
          generate_release_notes: true
