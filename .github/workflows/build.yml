name: Build APK + AAB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the hub APKs and AABs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository carries no Gradle wrapper binary, so the version is pinned here instead.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # No key material is in the repository: the keystore arrives base64-encoded from the
      # KEYSTORE_BASE64 secret and exists only for the length of this job.
      - name: Reconstruct the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set for this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myhub.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/myhub.p12" >> "$GITHUB_ENV"

      # The time arithmetic's check borrows the Kotlin compiler out of Gradle's own cache, and a
      # compile served FROM-CACHE never puts it there - so after a cancelled run had poisoned the
      # dependency cache this step exited 2 ("no Kotlin compiler in the Gradle cache") on a build
      # that had just succeeded. A compile that is certain to happen comes first, so nothing here
      # depends on the cache's mood.
      - name: Warm the Kotlin compiler
        run: gradle :app:compileDebugKotlin --rerun-tasks --no-daemon

      # Both formats, both build types: the APK is what a phone installs by hand, the AAB is what
      # Play Console takes. assemble* = APK, bundle* = AAB.
      - name: Build the APKs and AABs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: myhub
        run: |
          gradle assembleDebug assembleRelease bundleDebug bundleRelease \
            --no-daemon --stacktrace

      # An unsigned release build is not a failed one - AGP writes app-release-unsigned.apk and
      # carries on - so the outputs have to be named to be checked. The AAB has the same trap:
      # with no signing config it is still written, unsigned, and Play refuses it a day later.
      - name: Check the release APK is signed and both AABs exist
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          DAAB=app/build/outputs/bundle/debug/app-debug.aab
          if [ ! -f "$APK" ]; then
            echo "::error::the release APK is unsigned - the signing secrets did not reach the build"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          for f in "$AAB" "$DAAB"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced - bundleDebug/bundleRelease did not run"
              ls -l app/build/outputs/bundle/ || true
              exit 1
            fi
          done
          echo "signed and packaged: $APK ($(du -h "$APK" | cut -f1)), $AAB ($(du -h "$AAB" | cut -f1))"

      # The card's time is arithmetic on the usage log; it has its own check and it runs here,
      # on the same Kotlin the APK was just built with.
      - name: Check the time arithmetic
        run: sh dev/check-usage-sum.sh

      # The page is the app's screen, so it has to be in the APK that was just built - a release
      # whose 
      - name: Check the screen page is in the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q 'assets/index.html' \
            || { echo "::error::assets/index.html is missing from the APK"; unzip -l "$APK" | grep assets || true; exit 1; }
          V="$(grep -oE 'HUB_PAGE = "[^"]+"' app/src/main/assets/index.html | head -1 | cut -d'"' -f2)"
          N="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          [ "$V" = "$N" ] \
            || { echo "::error::the page says $V and the build says $N"; exit 1; }
          echo "page $V shipped beside build $N"

      # Flat, versioned names in one folder, the way a release is laid out. Gradle's own tree
      # (apk/debug, bundle/release, all called app-*) hid the AAB completely: the APK was easy to
      # find and the bundle was two folders away with no version on it.
      - name: Name the outputs
        run: |
          V="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          if [ -z "$V" ]; then echo "::error::could not read versionName"; exit 1; fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk        "dist/MyHub-$V-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk    "dist/MyHub-$V.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab     "dist/MyHub-$V-debug.aab"
          cp app/build/outputs/bundle/release/app-release.aab "dist/MyHub-$V.aab"
          echo '--- dist ---'
          ls -l dist

      - name: Upload the APKs and AABs
        uses: actions/upload-artifact@v4
        with:
          name: MyHub-apk-aab
          path: dist/*
          if-no-files-found: error
