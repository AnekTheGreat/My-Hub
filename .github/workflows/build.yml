name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the hub APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository carries no Gradle wrapper binary, so the version is pinned here instead.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # No key material is in the repository: the keystore arrives base64-encoded from the
      # KEYSTORE_BASE64 secret and exists only for the length of this job.
      - name: Reconstruct the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set for this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myhub.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/myhub.p12" >> "$GITHUB_ENV"

      - name: Build the APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: myhub
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      # An unsigned release build is not a failed one - AGP writes app-release-unsigned.apk and
      # carries on - so the output has to be named to be checked.
      - name: Check the release APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::the release APK is unsigned - the signing secrets did not reach the build"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "signed and packaged: $APK ($(du -h "$APK" | cut -f1))"

      # The card's time is arithmetic on the usage log; it has its own check and it runs here,
      # on the same Kotlin the APK was just built with.
      - name: Check the time arithmetic
        run: sh dev/check-usage-sum.sh

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyHub-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
