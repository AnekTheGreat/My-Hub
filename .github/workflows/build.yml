name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build the hub APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository carries no Gradle wrapper binary, so the version is pinned here instead.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # The card's time is arithmetic on the usage log; it has its own check and it runs here,
      # on the same Kotlin the APK was just built with.
      - name: Check the time arithmetic
        run: sh dev/check-usage-sum.sh

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: MyHub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
