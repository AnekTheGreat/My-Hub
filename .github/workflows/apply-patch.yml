name: Apply the queued patch

# One-shot maintenance run: applies a patch committed beside it, then removes the patch and commits
the result. It exists so a several-file change can be reviewed as one diff instead of being retyped
in full, and it does nothing at all on a schedule or a push - only a manual dispatch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply dev/ship.patch
        run: |
          set -euo pipefail
          git apply --check --verbose dev/ship.patch
          git apply --whitespace=nowarn dev/ship.patch
          rm -f dev/ship.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 1.10.2 - the update prompt stops nagging, and the screen has a little life"
          git push
